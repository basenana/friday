name: unittest

on:
  pull_request:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

      - name: Run command permission contract
        run: go test -tags=e2e ./e2e -run '^TestPermission_'

  native-sandbox-linux:
    runs-on: ubuntu-latest
    env:
      FRIDAY_REQUIRE_NATIVE_SANDBOX: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run native bubblewrap contract
        run: go test -race ./sandbox -run 'TestBwrap|TestBuildArgs|TestBackendContract'

  native-sandbox-macos:
    runs-on: macos-latest
    env:
      FRIDAY_REQUIRE_NATIVE_SANDBOX: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Run native Seatbelt contract
        run: go test -race ./sandbox -run 'TestGenerateProfile|TestSeatbelt|TestBackendContract'
